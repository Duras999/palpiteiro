<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Palpiteiro</title>
<meta name="apple-mobile-web-app-title" content="Palpiteiro">
<meta name="application-name" content="Palpiteiro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e12">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="shortcut icon" href="icon-192.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=5">
<meta name="description" content="Jogos do dia, estatísticas, sequências e bilhetes prontos de futebol. +18">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://sportscore.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#0b0e12; --card:#161b21; --card2:#1d242c; --line:#252d36;
    --txt:#eef2f6; --mut:#8a96a3; --green:#19e07a; --green2:#0fb862;
    --yel:#ffd34d; --red:#ff5a5a; --acc:#7c86ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body,button,a{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
  .wrap{max-width:520px;margin:0 auto}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* topo */
  .top{position:sticky;top:0;z-index:5;background:linear-gradient(#0b0e12 80%,rgba(11,14,18,0));padding:14px 16px 10px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--green),#0a8f4c);
        display:grid;place-items:center;font-weight:800;color:#04210f;font-size:15px;box-shadow:0 0 18px rgba(25,224,122,.35)}
  .home-btn{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;-webkit-tap-highlight-color:transparent}
  .home-btn:active{opacity:.7}
  .seg{display:flex;background:#16191d;border-radius:99px;padding:4px;margin:0 0 12px}
  .seg button{flex:1;padding:8px 0;border-radius:99px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;letter-spacing:.2px;text-transform:uppercase;color:#f1f2f4}
  .seg button.on{background:#e9eaec;color:#121417}
  .ctrl{display:flex;gap:10px;align-items:stretch;margin-top:10px}
  .ctrl .day{flex:1;margin-top:0}
  .live{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:99px;border:1.5px solid #e5484d;color:#e5484d;background:rgba(229,72,77,.08);font-weight:600;font-size:15px}
  .live i{width:13px;height:13px;border-radius:50%;border:2.5px solid currentColor;display:block}
  .live.on{background:#e5484d;color:#fff}
  .live.on i{background:#fff;border-color:#fff;animation:p 1.6s infinite}
  body.locked #app, body.locked nav, body.locked .ptr{display:none!important}
  #gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
  #gate[hidden]{display:none}
  .g-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
  .g-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .g-logo img{width:44px;height:44px;border-radius:12px}
  .g-logo h1{font-size:26px;font-weight:800}.g-logo h1 span{color:var(--green)}
  .g-card h2{text-align:center;font-size:20px}
  .g-sub{text-align:center;color:var(--mut);font-size:14px;line-height:1.45}
  .g-card input{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);font:inherit;font-size:16px;outline:0}
  .g-card input:focus{border-color:var(--green)}
  .g-main{background:var(--green);color:#04210f;font-weight:800;font-size:16px;padding:14px;border-radius:14px}
  .g-google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;font-weight:700;font-size:15px;padding:13px;border-radius:14px}
  .g-ghost{background:var(--card);color:var(--txt);font-weight:600;padding:13px;border-radius:14px}
  .g-card button:disabled{opacity:.6}
  .g-or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
  .g-or:before,.g-or:after{content:"";flex:1;height:1px;background:var(--line)}
  .g-err{color:var(--red);font-size:14px;text-align:center}
  .g-link{text-align:center;color:var(--mut);font-size:14px}.g-link a{color:var(--green);font-weight:700;text-decoration:none}
  .g-load{display:flex;justify-content:center;padding:30px}
  .g-ok{color:var(--green);font-size:14px;text-align:center}
  .g-small{text-align:center;font-size:13px}.g-small a{color:var(--mut)}
  .g-check{display:flex;align-items:flex-start;gap:10px;color:var(--mut);font-size:13px;line-height:1.4;text-align:left}
  .g-check input{width:20px;height:20px;flex:none;padding:0;accent-color:var(--green)}
  .g-warn{background:rgba(255,211,77,.1);border:1px solid rgba(255,211,77,.35);border-radius:14px;padding:12px;color:#e9d9a0;font-size:13.5px;line-height:1.45;text-align:center;display:flex;flex-direction:column;gap:10px}
  .g-warn b{color:var(--yel)}
  .g-warn a,.g-warn button{background:var(--yel);color:#111;font-weight:800;border-radius:12px;padding:11px;text-decoration:none;font-size:14px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brandrow .brand{margin-bottom:0;min-width:0}
  .brandrow .brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* celular estreito com 🔥 + Instalar + perfil: o escudo já identifica o app */
  @media(max-width:400px){.brandrow.apertado .brand h1{display:none}}
  .hinst{flex:none;padding:8px 13px;border-radius:99px;background:rgba(25,224,122,.12);color:var(--green);font-weight:700;font-size:13px;border:1px solid rgba(25,224,122,.3)}
  .av-btn{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--card2);display:grid;place-items:center;
          font-weight:800;font-size:14px;color:var(--txt);border:1.5px solid #2f3842;padding:0}
  .av-btn:active{opacity:.7}
  .av-btn img{width:100%;height:100%;object-fit:cover}
  .pf-top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px 20px}
  .pf-foto{width:92px;height:92px;border-radius:50%;overflow:hidden;background:var(--card2);display:grid;place-items:center;
           font-size:34px;font-weight:800;color:var(--mut);border:2px solid #2f3842}
  .pf-foto img{width:100%;height:100%;object-fit:cover}
  .pf-nome{font-size:21px;font-weight:800;text-align:center;letter-spacing:-.2px}
  .pf-l{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
  .pf-l:last-child{border:0}
  .pf-l span{color:var(--mut);font-size:13.5px;flex:none}
  .pf-l b{font-weight:600;font-size:14.5px;text-align:right;word-break:break-word}
  .pf-bt{display:block;width:100%;text-align:center;text-decoration:none;padding:13px;border-radius:14px;background:var(--card);
         color:var(--txt);font-weight:700;font-size:15px;margin-top:9px;border:1px solid var(--line)}
  .pf-bt.sai{background:rgba(255,90,90,.1);color:var(--red);border-color:rgba(255,90,90,.25)}
  .pf-bt.inst{background:rgba(25,224,122,.12);color:var(--green);border-color:rgba(25,224,122,.3)}
  .pf-bt.tk{background:rgba(254,44,85,.12);color:#ff647f;border-color:rgba(254,44,85,.3);display:flex;align-items:center;justify-content:center;gap:9px}
  .pf-bt svg{width:17px;height:17px;flex:none}
  .ze{display:flex;align-items:center;gap:12px;margin:4px 16px 12px;background:linear-gradient(135deg,#1a1026,#161b21 60%);
      border:1px solid #3a2a52;border-radius:20px;padding:13px}
  .ze-foto{width:52px;height:52px;border-radius:14px;flex:none;background:linear-gradient(135deg,#25f4ee,#fe2c55);
           display:grid;place-items:center;font-size:25px;overflow:hidden}
  .ze-foto img{width:100%;height:100%;object-fit:cover}
  .ze-t{flex:1;min-width:0}
  .ze-t b{display:block;font-size:15px;font-weight:800;margin-bottom:2px}
  .ze-t span{color:var(--mut);font-size:12.5px;line-height:1.35;display:block}
  .ze-bt{flex:none;padding:10px 15px;border-radius:12px;background:#fe2c55;color:#fff;font-weight:800;font-size:13px;text-decoration:none}
  .dia{background:linear-gradient(150deg,#2a2410,#161b21 60%);border:1px solid #4a3d16;border-radius:22px;margin:4px 16px 14px;padding:15px}
  .dia-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .dia-h b{flex:1;font-size:15px;font-weight:800;color:var(--yel)}
  .dia-j{color:var(--mut);font-size:13px}
  .dia-m{font-size:19px;font-weight:800;margin:3px 0 10px}
  .prev{margin-top:14px;max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
  .prev .pv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
  .prev .pv:last-child{border:0}
  .prev .pv i{color:var(--mut);font-size:12.5px;font-style:normal;width:42px;flex:none}
  .prev .pv span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prev-t{color:var(--mut);font-size:12.5px;text-align:center;margin-top:10px;line-height:1.45}
  .bemvindo{position:fixed;inset:0;z-index:115;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:22px}
  .bemvindo[hidden]{display:none}
  .bv{background:var(--bg);border:1px solid var(--line);border-radius:24px;max-width:380px;width:100%;padding:24px 20px;text-align:center;animation:f .3s ease}
  .bv .ok{width:66px;height:66px;border-radius:50%;background:rgba(25,224,122,.14);color:var(--green);display:grid;place-items:center;
          font-size:32px;margin:0 auto 14px}
  .bv h2{font-size:22px;font-weight:800;margin-bottom:8px}
  .bv p{color:var(--mut);font-size:14.5px;line-height:1.5;margin-bottom:16px}
  .bv ul{text-align:left;margin:0 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
  .bv li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#cfd6dd;line-height:1.4}
  .bv li b{color:var(--txt)}
  .bv li em{font-style:normal;font-size:17px;flex:none;width:24px;text-align:center}
  .erro-box{text-align:center;padding:34px 22px;color:var(--mut);line-height:1.6}
  .erro-box .ic{font-size:40px;margin-bottom:10px}
  .erro-box b{display:block;color:var(--txt);font-size:17px;margin-bottom:6px}
  .retry{display:inline-block;margin-top:14px;padding:11px 22px;border-radius:12px;background:rgba(25,224,122,.12);color:var(--green);font-weight:700}
  .quiet .fade{animation:none}
  .acct{margin:0 16px 8px;color:#5f6b77;font-size:12px;text-align:center}
  .acct button{color:var(--mut);font-size:12px;text-decoration:underline;padding:6px}
  .ptr{position:fixed;top:0;left:50%;transform:translate(-50%,-60px);z-index:30;width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--green);box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .25s}
  .ptr svg{width:22px;height:22px}
  .ptr.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .brand h1 span{color:var(--green)}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;color:var(--mut)}
  .sbar{display:flex;gap:8px;align-items:stretch}
  .sbar .search{flex:1;min-width:0}
  .sbar .search input{min-width:0}
  .favbtn{flex:none;display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:14px;background:var(--card);color:var(--txt);font-weight:700;font-size:13.5px;white-space:nowrap}
  .favbtn svg{width:18px;height:18px;color:var(--yel)}
  .favbtn.on svg{fill:var(--yel)}
  .fstar{color:var(--yel);font-size:12px;margin-left:5px;vertical-align:1px}
  .lbadge.favl{background:rgba(255,211,77,.14);color:var(--yel)}
  .lbadge.favl svg{width:22px;height:22px;fill:var(--yel)}
  .favnone{padding:4px 16px 14px;color:var(--mut);font-size:13.5px;line-height:1.45}
  .favnone button{color:var(--green);font-weight:700;font-size:13.5px}
  #fav{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
  #fav[hidden]{display:none}
  .fav-sheet{background:var(--bg);width:100%;max-width:520px;height:92%;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;animation:f .25s ease}
  @media(min-width:700px){#fav{align-items:center}.fav-sheet{border-radius:24px;border-bottom:1px solid var(--line);height:min(86vh,760px)}}
  .fav-head{padding:20px 16px 12px}
  .fav-head h2{font-size:21px;font-weight:800;margin-bottom:5px;letter-spacing:-.2px}
  .fav-head p{color:var(--mut);font-size:14px;line-height:1.45;margin-bottom:14px}
  .fav-body{flex:1;overflow-y:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .fav-lg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--mut);margin:16px 2px 9px}
  .fav-lg:first-child{margin-top:4px}
  .fav-lg img{width:18px;height:18px;object-fit:contain}
  .fav-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .fav-t{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;border-radius:16px;background:var(--card);border:1.5px solid transparent;font-size:12.5px;font-weight:600;line-height:1.2;min-width:0}
  .fav-t span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap;padding:0 4px}
  .fav-t .crest{width:36px;height:36px;font-size:11px}
  .fav-t.on{border-color:var(--green);background:rgba(25,224,122,.09)}
  .fav-t.on span{color:var(--green)}
  .fav-t.on:after{content:"✓";position:absolute;top:6px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#04210f;font-size:11px;font-weight:900;display:grid;place-items:center}
  .fav-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .fav-skip{flex:none;padding:0 20px;border-radius:16px;background:var(--card);font-weight:700;color:var(--mut)}
  .fav-foot .gen{margin-top:0;flex:1}
  body.noscroll{overflow:hidden}
  body.noscroll .inst{display:none}
  .tbar{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .tbar h1{flex:1;font-size:20px;font-weight:800;letter-spacing:-.3px}.tbar h1 span{color:var(--green)}
  .tback{font-size:22px;padding:4px 8px 4px 0}
  .tplus{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));color:#04210f;font-size:26px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 0 16px rgba(25,224,122,.3)}
  .tplus:active{opacity:.75}
  .lhead .crest{width:40px;height:40px;font-size:12px}
  .nx .time{width:64px;font-size:13px;line-height:1.35}
  .nx .time b{display:block;color:var(--txt);font-weight:600;font-size:14px}
  .nx .vs{color:var(--mut);font-size:12px;margin-right:2px}
  .nx .where{font-size:11px;font-weight:700;color:var(--mut);background:var(--card2);padding:5px 9px;border-radius:99px;white-space:nowrap}
  .nonext{padding:12px 16px 14px;border-top:1px solid var(--line);color:var(--mut);font-size:13.5px}
  .bigadd{display:inline-block;margin-top:16px;padding:13px 24px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green2));color:#04210f;font-weight:800}
  .fire{flex:none;display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:99px;background:rgba(255,154,61,.14);color:#ff9a3d;font-weight:800;font-size:13px}
  .resumo{margin:0 16px 10px;background:linear-gradient(145deg,#15241c,#161b21 60%);border:1px solid #23402f;border-radius:18px;padding:13px 14px;display:flex;gap:10px;align-items:flex-start}
  .resumo .rx{flex:1;font-size:13.5px;color:#cfd6dd;line-height:1.5}
  .resumo b{color:var(--txt);font-size:15px;display:block;margin-bottom:3px}
  .resumo .rc{color:var(--green);font-weight:700}
  .resumo button{color:var(--mut);font-size:17px;padding:0 2px;line-height:1;flex:none}
  .recado{display:flex;align-items:center;gap:11px;margin:0 16px 10px;background:linear-gradient(135deg,#1d2433,#161b21 65%);
          border:1px solid #30405c;border-radius:18px;padding:12px 13px}
  .recado span{flex:1;min-width:0;font-size:13.5px;line-height:1.45;color:#cfd6dd}
  .recado .ic{flex:none;font-size:18px}
  .recado a{flex:none;padding:9px 14px;border-radius:12px;background:#4c8dff;color:#fff;font-weight:800;font-size:13px;text-decoration:none}
  .bl{background:var(--card);border-radius:18px;margin:10px 16px;padding:12px 13px}
  .bl-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:9px}
  .bl-h b{color:#cfd6dd;font-weight:600}
  .bl-r{display:flex;flex-direction:column;gap:8px}
  .bl-tm{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
  .bl-tm .crest{flex:none;width:26px;height:26px}
  .bl-tm span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bl-i{width:46px;height:44px;flex:none;text-align:center;font-size:17px;font-weight:800;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;color:var(--txt);outline:0;-moz-appearance:textfield}
  .bl-i::-webkit-outer-spin-button,.bl-i::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .bl-i:focus{border-color:var(--green)}
  .bl-i.ok{border-color:var(--green);background:rgba(25,224,122,.08)}
  .bl-x{color:var(--mut);font-size:13px;flex:none}
  .bl-sc{width:46px;height:44px;flex:none;display:grid;place-items:center;font-size:17px;font-weight:800;background:var(--card2);border-radius:12px}
  .bl-pt{margin-top:9px;text-align:center;font-size:12.5px;font-weight:700}
  .rk{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;margin:8px 16px;padding:12px 14px}
  .rk.eu{background:rgba(25,224,122,.1);border:1px solid rgba(25,224,122,.3)}
  .rk .p{width:30px;font-size:16px;font-weight:800;color:var(--mut);text-align:center;flex:none}
  .rk .p.m1{color:#ffd34d}.rk .p.m2{color:#cfd6dd}.rk .p.m3{color:#d9a066}
  .rk .nm{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rk .nm small{display:block;color:var(--mut);font-size:12px;font-weight:500}
  .rk .pt{font-size:19px;font-weight:800;color:var(--green);flex:none}
  .rk .pt small{display:block;font-size:11px;color:var(--mut);font-weight:600;text-align:right}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:16px}
  .chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
  .chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);font-weight:600;font-size:14px;color:var(--mut)}

/* ---------- medir se a confiança é verdade ----------
   O palpite é gravado ANTES do apito inicial e o resultado só entra depois.
   Assim dá para comparar, no painel, o que o app prometeu com o que aconteceu. */
const slugDoJogo = m => (m && m.url || "").split("/").filter(Boolean)[2] || "";
function conferirMercado(mk, placar, m) {
  const h = +placar.h, a = +placar.a;
  if (!Number.isFinite(h) || !Number.isFinite(a)) return null;
  const hn = short(m.home), an = short(m.away), tot = h + a;
  if (mk === "Mais de 2.5 gols") return tot > 2.5;
  if (mk === "Menos de 2.5 gols") return tot < 2.5;
  if (mk === "Ambas marcam: Sim") return h > 0 && a > 0;
  if (mk === "Ambas marcam: Não") return !(h > 0 && a > 0);
  let r;
  if ((r = /^Vitória do (.+)$/.exec(mk))) return r[1] === hn ? h > a : r[1] === an ? a > h : null;
  if ((r = /^(.+) ou empate$/.exec(mk))) return r[1] === hn ? h >= a : r[1] === an ? a >= h : null;
  if ((r = /^(.+) marca: Sim$/.exec(mk))) return r[1] === hn ? h > 0 : r[1] === an ? a > 0 : null;
  if ((r = /^(.+) -1 \(vence por 2 ou mais\)$/.exec(mk))) return r[1] === hn ? h - a >= 2 : r[1] === an ? a - h >= 2 : null;
  if ((r = /^(.+) \+1 \(não perde por 2 ou mais\)$/.exec(mk))) return r[1] === hn ? a - h < 2 : r[1] === an ? h - a < 2 : null;
  return null;   // cartões e primeiro tempo não dá para conferir só com o placar final
}
function registrarPalpites(id, m, lista) {
  if (!window.palCalibra || !lista || !lista.length) return;
  if (new Date(m.time).getTime() <= Date.now()) return;   // já começou, não vale registrar
  window.palCalibra.registrar(id, {
    jogo: `${short(m.home)} x ${short(m.away)}`, dia: localDay(new Date(m.time)),
    liga: m.lname || m.competition || "", kick: m.time, slug: slugDoJogo(m),
    picks: lista.map(p => ({mk: p.mk, conf: p.conf}))
  });
}
let calibraRodou = false;
async function resolverCalibra() {
  if (calibraRodou || !window.palCalibra) return;
  calibraRodou = true;
  try {
    const pend = await window.palCalibra.pendentes(dayOf(-4));
    for (const c of pend.slice(0, 20)) {
      if (!c.kick || (c.kick.toMillis ? c.kick.toMillis() : 0) > Date.now()) continue;
      let m = games[c.matchId];
      if (!m || m.status !== "finished") {
        if (!c.slug) continue;
        const d = await getJSON(`${API}/match/?sport=football&slug=${encodeURIComponent(c.slug)}`, 30).catch(() => null);
        m = d && d.match;
        if (!m || m.status !== "finished") continue;
      }
      const placar = {h: +m.home_score, a: +m.away_score};
      const acertos = (c.picks || []).map(x => conferirMercado(x.mk, placar, m));
      if (!acertos.length || acertos.some(x => x === null)) continue;
      await window.palCalibra.resolver(c.matchId, placar, acertos);
      await new Promise(r => setTimeout(r, 150));
    }
  } catch (e) { console.warn("Palpiteiro: medição", e); }
}

      .filter(m => m.status === "upcoming" && new Date(m.time).getTime() > Date.now())
      .sort((a, b) => a.time.localeCompare(b.time)).slice(0, 12);
    if (!jogos.length) { gerando = ""; toast("Nenhum jogo por começar hoje"); return render(false, true); }

/* ---------- cache simples ---------- */
const mem = {};
function pruneStore(all) {
  try {
    const now = Date.now(), ks = Object.keys(localStorage);
    for (const k of ks) {
      if (!k.startsWith("iag:")) continue;
      let t = 0; try { t = JSON.parse(localStorage.getItem(k)).t || 0; } catch (e) {}
      if (all || now - t > 36 * 3600000) localStorage.removeItem(k);
    }
    const cards = ks.filter(k => k.startsWith("iagc:"));
    if (all || cards.length > 250) cards.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}
pruneStore(false);
function store(k, v) {
  try { localStorage.setItem(k, v); }
  catch (e) { pruneStore(true); try { localStorage.setItem(k, v); } catch (e2) {} }
}
async function getJSON(url, ttlMin) {
  const now = Date.now();
  if (mem[url] && now - mem[url].t < ttlMin * 60000) return mem[url].d;
  try { const c = JSON.parse(localStorage.getItem("iag:" + url) || "null");
        if (c && now - c.t < ttlMin * 60000) { mem[url] = c; return c.d; } } catch (e) {}
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  let d;
  try {
    const r = await fetch(url, {signal: ctl.signal});
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (e) {
    // sem resposta agora: melhor mostrar o último dado guardado do que nada
    if (mem[url]) return mem[url].d;
    throw e;
  } finally { clearTimeout(timer); }
  mem[url] = {t: now, d};
  store("iag:" + url, JSON.stringify(mem[url]));
  return d;
}

const RISCOS = [
  {lbl: "Muito seguro",    min: 78, c: "#19e07a"},
  {lbl: "Seguro",          min: 70, c: "#a8e05f"},

const ANTIGOS = {"equilibrado": "Médio", "ousado": "Arriscado", "moderado": "Médio"};
const risco = pct => RISCOS.find(r => pct >= r.min) || RISCOS[RISCOS.length - 1];

const dayOf = off => localDay(new Date(Date.now() + off * 86400000));
async function loadDay(off, fresh) {
  const day = dayOf(off);
  // o dia no Brasil pega um pedaço do dia seguinte no horário mundial: buscamos os dois
  const next = new Date(new Date(day + "T12:00:00Z").getTime() + 86400000).toISOString().slice(0, 10);
  const days = [day, next];
  const ttl = fresh ? 0 : off === 0 ? 1 : 10;
  let fails = 0, tentou = 0;
  const pega = u => { tentou++; return getJSON(u, ttl).catch(() => { fails++; return {matches: []}; }); };
  // 1) tudo o que tem no mundo nesses dois dias  2) os principais um a um, para nunca faltarem
  const principais = await Promise.all(LEAGUES.flatMap(L =>
    days.map(d => pega(`${API}/fixtures/?sport=football&date=${d}&competition=${L.slug}&limit=100`).then(r => ({r, L})))));
  const geral = await Promise.all(days.map(d => pega(`${API}/fixtures/?sport=football&date=${d}&limit=200`).then(r => ({r, L: null}))));
  const tudo = [...principais, ...geral];
  if (fails === tentou) throw new Error("sem dados");
  const seen = new Set(), porLiga = new Map();
  for (const {r: lista, L: liga} of tudo) for (const m of (lista.matches || [])) {
    const id = mid(m);
    if (!id || !m.time || seen.has(id)) continue;
    if (localDay(new Date(m.time)) !== day) continue;
    seen.add(id);
    const inf = infoLiga(m.competition || (liga && liga.name));
    m.lname = liga ? liga.name : inf.nome;
    m.lslug = liga ? liga.slug : "";
    m.lprio = liga ? LEAGUES.indexOf(liga) : inf.prio;
    games[id] = m;
    const chave = m.lname;
    if (!porLiga.has(chave)) porLiga.set(chave, {L: liga
      ? {...liga, prio: m.lprio, logo: m.competition_logo || ""}
      : {name: chave, prio: m.lprio, c: corDoNome(chave), tc: "#fff", s: siglaDoNome(chave), logo: m.competition_logo || ""}, ms: []});
    porLiga.get(chave).ms.push(m);
  }
  const grupos = [...porLiga.values()];
  grupos.forEach(g => g.ms.sort((a, b) => a.time.localeCompare(b.time)));
  grupos.sort((a, b) => a.L.prio - b.L.prio || a.L.name.localeCompare(b.L.name, "pt-BR"));
  return grupos;
}

    W += w;

function venueStats(res, emCasa, comp) {

  const v = wstats(sub, comp);

    scored: base.filter(x => x.gf > 0).length,

function winProb(H, A, m, table) {
  const comp = (m && (m.competition || m.lname)) || "";

  if (!h || !a) return {h: 33, d: 34, a: 33};
  const th = tableStats(table, H.slug, m && m.home), ta = tableStats(table, A.slug, m && m.away);
  const d = (forca(h, th) + .30) - forca(a, ta);   // +0,30 = vantagem de jogar em casa
  const pd = Math.max(.15, Math.min(.30, .28 - Math.abs(d) * .05));
  const ph = (1 - pd) / (1 + Math.exp(-d * 1.1));
  const hh = Math.round(ph * 100), aa = Math.round((1 - pd - ph) * 100);

// Numa busca só, pega cartões e placar do primeiro tempo dos últimos jogos.
async function cardStats(T) {
  const one = async x => {
    const slug = (x.url || "").split("/").filter(Boolean)[2];
    if (!slug) return null;
    const key = "iagc2:" + slug + "|" + x.date;
    let c = null;
    try { c = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) {}
    if (!c) {
      const r = await fetch(`${API}/match/?sport=football&slug=${slug}`).catch(() => null);
      const d = r && r.ok ? await r.json().catch(() => null) : null, mm = d && d.match;
      if (!mm || mm.time !== x.date) return null;
      const cards = Array.isArray(mm.incidents) ? mm.incidents.filter(i => i.is_card).map(i => ({side: i.side, type: i.type})) : [];
      const h1 = +mm.home_ht_score, a1 = +mm.away_ht_score;
      c = {cards, ht: Number.isFinite(h1) && Number.isFinite(a1) ? [h1, a1] : null};
      if (!cards.length && !c.ht) return null;
      store(key, JSON.stringify(c));
    }
    const side = x.home ? "home" : "away";
    const mine = c.cards.filter(i => i.side === side), opp = c.cards.filter(i => i.side !== side);
    const ht = c.ht ? {gf: x.home ? c.ht[0] : c.ht[1], ga: x.home ? c.ht[1] : c.ht[0]} : null;
    return {y: mine.filter(i => /yellow/i.test(i.type)).length, r: mine.filter(i => /red/i.test(i.type)).length,
            tot: c.cards.length, opp: opp.length, temCartao: c.cards.length > 0, ht};
  };
  const games = [];
  for (const x of T.res.slice(0, 5)) {
    let g = await one(x).catch(() => null);
    if (!g) { await new Promise(r => setTimeout(r, 400)); g = await one(x).catch(() => null); }
    games.push(g);
  }
  const g = games.filter(Boolean), comCartao = g.filter(x => x.temCartao), hts = g.filter(x => x.ht).map(x => x.ht);
  if (!g.length) return null;
  const n = comCartao.length;
  const sum = k => comCartao.reduce((a, x) => a + x[k], 0);
  return {n, y: n ? sum("y") / n : 0, r: sum("r"), tot: n ? sum("tot") / n : 0, opp: n ? sum("opp") / n : 0,
    ht: hts.length ? {n: hts.length, over05: hts.filter(x => x.gf + x.ga >= 1).length / hts.length,
      empate: hts.filter(x => x.gf === x.ga).length / hts.length, media: hts.reduce((a, x) => a + x.gf + x.ga, 0) / hts.length} : null};
}
/* Mercados que só dá para calcular depois que os detalhes chegam:
   cartões e primeiro tempo. Entram na lista assim que ficam prontos. */
function picksExtras(m, A) {
  const P = [], hn = short(m.home), an = short(m.away);
  const ch = A.cards && A.cards.h, ca = A.cards && A.cards.a;
  /* Teto mais baixo que os mercados principais: cartões e primeiro tempo são
     apostas de apoio, não devem roubar o lugar do palpite do jogo. */
  const add = (mk, score, why) => P.push({mk, conf: Math.max(52, Math.min(82, Math.round(score))), why, extra: true});
  if (ch && ca && ch.n >= 3 && ca.n >= 3) {
    const med = (ch.tot + ca.tot) / 2;   // média de cartões por jogo, contando os dois lados
    if (med >= 5.2) add("Mais de 4.5 cartões", 42 + Math.min(med - 4.5, 3) * 13,
      `Os jogos do ${hn} tiveram ${ch.tot.toFixed(1)} cartões em média e os do ${an}, ${ca.tot.toFixed(1)} — cerca de ${med.toFixed(1)} por jogo.`);
    else if (med <= 3.2) add("Menos de 4.5 cartões", 44 + (4.5 - med) * 12,
      `Jogo calmo pelos números: ${ch.tot.toFixed(1)} cartões por jogo do ${hn} e ${ca.tot.toFixed(1)} do ${an}.`);
  }
  const th = ch && ch.ht, ta = ca && ca.ht;
  if (th && ta && th.n >= 3 && ta.n >= 3) {
    const o05 = (th.over05 + ta.over05) / 2, emp = (th.empate + ta.empate) / 2;
    if (o05 >= .75) add("Mais de 0.5 gol no 1º tempo", 40 + o05 * 50,
      `Teve gol no primeiro tempo em ${Math.round(th.over05 * th.n)} dos ${th.n} jogos do ${hn} e ${Math.round(ta.over05 * ta.n)} dos ${ta.n} do ${an}.`);
    if (emp >= .55) add("Empate no 1º tempo", 38 + emp * 55,
      `O primeiro tempo terminou empatado em ${Math.round(th.empate * th.n)} dos ${th.n} jogos do ${hn} e ${Math.round(ta.empate * ta.n)} dos ${ta.n} do ${an}.`);
  }
  return P;
}
const analysis = {};

  if (analysis[id]) return analysis[id];

  H.res6 = H.res.slice(0, 6); A.res6 = A.res.slice(0, 6);

    m.lslug ? getJSON(`${API}/standings/?sport=football&competition=${m.lslug}`, 60).catch(() => null) : Promise.resolve(null)]);
  const seq = [...sequences(short(m.home), m.home_logo, H.st), ...sequences(short(m.away), m.away_logo, A.st)].sort((x, y) => y.k - x.k);
  const R = analysis[id] = {H, A, h2h, table, cards: null, cardsBusy: true, seq, picks: picks(m, H, A, h2h, table)};
  Promise.all([cardStats(H).catch(() => null), cardStats(A).catch(() => null)]).then(([h, a]) => {

  const max = off !== 0 ? 10 * 60000 : (hasLive || soon) ? 60000 : 4 * 60000;

  loadDay(off, true).then(d => {

/* ---------- tela Meus times: próximos jogos ---------- */
const teamIs = (f, name) => !!name && (slugify(name) === f.slug || tkey(name) === tkey(f.name));
let nextCache = null;
async function nextGames() {
  const key = favs.map(f => f.slug).join(",");
  if (nextCache && nextCache.key === key && Date.now() - nextCache.t < 10 * 60000) return nextCache.d;
  const from = Date.now() - 2 * 3600000;
  const up = m => m && m.time && m.status !== "finished" && new Date(m.time).getTime() > from;
  const res = await Promise.all(favs.map(async f => {
    const t = await getJSON(`${API}/team/?slug=${encodeURIComponent(f.slug)}`, 60).catch(() => null);
    return {f, ok: !!t, list: ((t && t.matches) || []).filter(up)};
  }));
  // se a fonte não mandou a agenda do time, procura nos jogos dos próximos 7 dias
  if (res.some(r => !r.list.length)) {
    const days = await Promise.all([0, 1, 2, 3, 4, 5, 6].map(async off => {
      const k = dayOf(off);
      if (!dayCache[k]) { try { dayCache[k] = {t: Date.now(), d: await loadDay(off)}; } catch (e) { return []; } }
      return dayCache[k].d.flatMap(g => g.ms);
    }));
    const week = days.flat().filter(up);
    for (const r of res) if (!r.list.length) { r.list = week.filter(m => teamIs(r.f, m.home) || teamIs(r.f, m.away)); if (week.length) r.ok = true; }
  }
  const logoOf = n => { const f = favs.find(x => teamIs(x, n)); return f ? f.logo : ""; };
  for (const r of res) {
    const seen = new Set();
    r.list = r.list.filter(m => { const id = mid(m); if (!id || seen.has(id)) return false; seen.add(id); return true; })
      .sort((a, b) => a.time.localeCompare(b.time)).slice(0, 3);
    for (const m of r.list) {
      const id = mid(m);
      if (!games[id]) games[id] = {...m, home_logo: m.home_logo || logoOf(m.home), away_logo: m.away_logo || logoOf(m.away), lname: m.lname || m.competition || ""};
    }
  }
  if (res.some(r => r.ok)) nextCache = {key, t: Date.now(), d: res};
  return res;
}

  for (const {f, ok, list} of res) {

    for (const m of list) {
      const g = games[mid(m)] || m, home = teamIs(f, m.home), opp = home ? m.away : m.home, lbl = whenLabel({t: m.time}).split(" ");
      const live = m.status === "live";

        <div class="teams"><div class="team"><span class="vs">x</span>${crest(opp, home ? g.away_logo : g.home_logo)}${esc(short(opp))}</div></div>
        <span class="where">${home ? "Em casa" : "Fora"}</span></button>`;
    }
    html += `</div>`;
  }
  return html + `<div style="padding:4px 16px 0"><button class="add" onclick="openFavs(false)">+ Adicionar ou remover times</button></div>` + credit;
}

/* ---------- bolão: chuta o placar, ganha ponto ---------- */
let bolaoTab = "hoje", bolaoMeus = null, bolaoRank = null, bolaoDia = "";
const pontosDe = (g, m) => {
  const hs = +m.home_score, as = +m.away_score;
  if (!Number.isFinite(hs) || !Number.isFinite(as)) return 0;
  if (g.h === hs && g.a === as) return 5;
  return Math.sign(g.h - g.a) === Math.sign(hs - as) ? 2 : 0;
};
async function salvarPalpite(id, el) {
  const m = games[id]; if (!m || !window.palBolao) return;
  const ins = el.closest(".bl").querySelectorAll(".bl-i");
  const h = parseInt(ins[0].value, 10), a = parseInt(ins[1].value, 10);
  if (!Number.isFinite(h) || !Number.isFinite(a) || h < 0 || a < 0 || h > 20 || a > 20) return;
  if (new Date(m.time).getTime() <= Date.now()) return toast("Esse jogo já começou");
  try {
    await window.palBolao.salvar(id, m.time, h, a);
    bolaoMeus = bolaoMeus || {}; bolaoMeus[id] = {h, a, pts: 0, pontuado: false};
    ins.forEach(i => i.classList.add("ok"));
    toast("Palpite salvo");
  } catch (e) { console.error(e); toast("Não deu para salvar"); }
}

      try { bolaoRank = await window.palBolao.ranking(); } catch (e) { return head + `<div class="empty">Não deu para carregar o ranking.<br><button class="retry" onclick="bolaoRank=null;render()">Tentar de novo</button></div>`; }

        <div class="bl-tm">${crest(m.away, m.away_logo)}<span>${esc(short(m.away))}</span>${campo(0, "a")}</div></div>
      ${g && fim ? `<div class="bl-pt" style="color:${g.pts ? "var(--green)" : "var(--mut)"}">${g.pts ? `+${g.pts} ponto${g.pts > 1 ? "s" : ""}` : "Não pontuou"}</div>`
        : comecou && !g ? `<div class="bl-pt" style="color:var(--mut)">Você não palpitou nesse</div>` : ""}</div>`;
  }
  return html + `<p class="note">${ganhos ? `Você fez <b style="color:var(--green)">${ganhos} ponto${ganhos > 1 ? "s" : ""}</b> hoje.<br>` : ""}Palpite antes do jogo começar. Placar exato vale 5 pontos, acertar quem ganha vale 2.<br>Isso aqui é brincadeira, não é aposta.</p>`;
}

function slipView() {
  let html = `<div class="top"><div class="brand"><button class="home-btn" onclick="goHome()" aria-label="Início"><img class="logo" src="icon-192.png?v=3" alt="Palpiteiro"></button><h1>Meu <span>bilhete</span></h1></div></div><div class="box fade">`;
  if (!slip.length) html += `<div class="empty">Seu bilhete está vazio.<br>Abra um jogo, toque em <b style="color:var(--green)">Palpites do Palpiteiro</b> e adicione as seleções.</div>`;
  else {
    html += slip.map((s, i) => `<div class="slip-item">${crest(s.h, s.hl)}<div style="flex:1">
      <div class="g">${esc(short(s.h))} x ${esc(short(s.a))} · ${esc(whenLabel(s))}</div><div class="m">${esc(s.mk)}</div>
      <div class="g" style="margin-top:4px"><span class="rsk" style="color:${risco(s.conf).c};background:${risco(s.conf).c}1f"><i></i>${risco(s.conf).lbl} · ${s.conf}%</span></div></div>
      <button class="rm" onclick="slip.splice(${i},1);saveSlip();render()">✕</button></div>`).join("");
    const avg = Math.round(slip.reduce((a, s) => a + s.conf, 0) / slip.length);
    const ch = chanceBilhete(slip), rb = risco(ch);
    html += `<div class="total"><span>${slip.length} seleç${slip.length > 1 ? "ões" : "ão"}</span><span>Confiança média <b style="color:${risco(avg).c}">${avg}%</b></span></div>
      <div class="slip-rsk">${rskTag(rb, "rsk-big")}<div class="ch">Chance de bater tudo<b style="color:${rb.c}">${ch}%</b></div></div>
      <a class="gen" style="margin-top:14px;display:block;text-align:center;text-decoration:none" href="https://a.bingoem.casa/t/NTk2OTEwXzM=" target="_blank" rel="noopener" onclick="copySlip(true);window.track&&window.track('bets')">Apostar</a>`;
  }
  return html + (slip.length ? LEGENDA : "") + `</div><p class="note">Quanto mais seleções, menor a chance de o bilhete inteiro bater.<br>+18 · Aposte com responsabilidade.</p>` + acct();
}
function toggle(id, mk, conf) {
  const i = slip.findIndex(s => s.id === id && s.mk === mk);
  if (i >= 0) { slip.splice(i, 1); toast("Removido do bilhete"); }
  else { const m = games[id]; if (!m) return; slip.push({id, mk, conf, h: m.home, a: m.away, hl: m.home_logo, t: m.time}); toast("Adicionado ao bilhete"); window.track && window.track("tickets"); }
  saveSlip(); render();
}
function copySlip(silent) {
  const txt = "BILHETE PALPITEIRO\n\n" + slip.map(s => `${short(s.h)} x ${short(s.a)} (${whenLabel(s)})\n${s.mk}`).join("\n\n") + "\n\n+18 | Aposte com responsabilidade";
  try { navigator.clipboard.writeText(txt).then(() => toast("Bilhete copiado"), () => { if (!silent) toast("Não deu pra copiar aqui"); }); } catch (e) {}
}

let renderId = 0;
async function render(keepFocus, quiet) {
  const my = ++renderId;
  document.body.classList.toggle("quiet", !!quiet);
  const h = location.hash.slice(1);
  const aba = h === "bilhete" ? "bilhete" : h === "bolao" ? "bolao" : "jogos";
  ["jogos", "bolao", "bilhete"].forEach(k => $("#nav-" + k).classList.toggle("on", k === aba));
  let html;
  try {
    if (h.startsWith("jogo-")) html = await detailView(decodeURIComponent(h.slice(5)));
    else if (h === "bilhete") html = slipView();
    else if (h === "times") html = await timesView();
    else if (h === "bolao") html = await bolaoView();
    else if (h === "perfil") html = perfilView();
    else html = await homeView();
  } catch (e) {
    console.error("Palpiteiro render", e);
    html = `<div class="box"><div class="empty">Deu um erro ao montar a tela.<br><button class="retry" onclick="location.hash='';render()">Voltar ao início</button></div></div>`;
  }
  if (html == null || my !== renderId) return;
  $("#app").innerHTML = html;
  if (keepFocus) { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  $("#app").querySelectorAll(".bl-i").forEach(i => i.onchange = () => salvarPalpite(i.dataset.id, i));
}
window.addEventListener("hashchange", () => { tab = "seq"; render(); window.scrollTo(0, 0); });
// Quem ainda não foi aprovado vê os jogos do dia, sem os palpites.
window.palPrevia = async (el) => {
  if (!el) return;
  try {
    const dia = dayOf(0);
    if (!dayCache[dia]) dayCache[dia] = {t: Date.now(), d: await loadDay(0)};
    const ms = dayCache[dia].d.flatMap(g => g.ms).sort((a, b) => a.time.localeCompare(b.time)).slice(0, 12);
    if (!ms.length) { el.innerHTML = `<p class="prev-t">Hoje não tem jogo dos campeonatos principais.</p>`; return; }
    el.innerHTML = `<div class="prev">${ms.map(m => `<div class="pv"><i>${m.status === "finished" ? "Fim" : m.status === "live" ? "AO VIVO" : hhmm(m.time)}</i>
      <span>${esc(short(m.home))} x ${esc(short(m.away))}</span></div>`).join("")}</div>
      <p class="prev-t">${ms.length} jogo${ms.length > 1 ? "s" : ""} hoje. Os palpites e os bilhetes aparecem assim que seu acesso for liberado.</p>`;
  } catch (e) { el.innerHTML = ""; }
};
window.palRender = () => { const h = location.hash.slice(1);
  if (h && !h.startsWith("jogo-")) return;
  const digitando = document.activeElement && document.activeElement.id === "q";
  render(digitando, true); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && location.hash.slice(1) === "times" && !document.body.classList.contains("locked")) render(false, true); });
/* ---------- sem zoom no celular ---------- */
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive: false}));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});

/* ---------- arrastar pra baixo para atualizar ---------- */
(function(){
  const el = $("#ptr"), T = 70; let y0 = null, d = 0, busy = false;
  const pos = p => el.style.transform = `translate(-50%,${p - 50}px) rotate(${p * 4}deg)`;
  addEventListener("touchstart", e => { y0 = (!busy && window.scrollY <= 0 && e.touches.length === 1) ? e.touches[0].clientY : null; d = 0; }, {passive: true});
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    d = (e.touches[0].clientY - y0) * 0.5;
    if (d <= 0) { el.style.transform = ""; return; }
    el.style.transition = "none"; pos(Math.min(d, T + 30));
  }, {passive: true});
  addEventListener("touchend", () => {
    if (y0 == null) return; y0 = null; el.style.transition = "";
    if (d >= T) {
      busy = true; el.classList.add("spin"); pos(T);
      try { Object.keys(localStorage).filter(k => k.startsWith("iag:")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
      setTimeout(() => location.reload(), 300);
    } else el.style.transform = "";
  });
})();
badge(); render();
</script>

<div class="inst" id="inst" role="dialog" aria-label="Instalar o Palpiteiro">
  <img src="icon-192.png?v=3" alt="">
  <div class="t" id="inst-t"><b>Instale o Palpiteiro</b>Abra direto da tela inicial, igual a um app.</div>
  <button class="ok" id="inst-ok">Instalar</button>
  <button class="x" id="inst-x" aria-label="Fechar">✕</button>
</div>
<script>
/* ---------- PWA: service worker + convite para instalar ---------- */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
(function(){
  const box = $("#inst"), KEY = "pal-inst-off";
  let snoozed = false; try { snoozed = Date.now() < +(localStorage.getItem(KEY) || 0); } catch (e) {}
  const ua = navigator.userAgent;
  const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const inApp = /instagram|fban|fbav|fb_iab|tiktok|musical_ly|bytedance|line\//i.test(ua);
  const mobile = ios || /android/i.test(ua);
  let prompt = null;
  const locked = () => document.body.classList.contains("locked");
  const place = () => { const n = document.querySelector(".nav"); box.style.bottom = (n && !locked()) ? (innerHeight - n.getBoundingClientRect().top + 10) + "px" : ""; };
  addEventListener("resize", place);
  const reveal = () => { place(); box.classList.add("show"); };
  const hide = days => { box.classList.remove("show"); try { localStorage.setItem(KEY, Date.now() + days * 86400000); } catch (e) {} };
  const B = t => `<b style="display:inline;font-size:13px">${t}</b>`;
  const help = html => { $("#inst-t").innerHTML = html; $("#inst-ok").hidden = true; reveal(); };
  const done = () => { canInstall = false; hide(3650); if (!locked()) render(false, true); };
  $("#inst-x").onclick = () => hide(7);
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); prompt = e; });
  addEventListener("appinstalled", () => { done(); toast("Palpiteiro instalado"); });
  const install = async () => {
    if (isStandalone) return;
    if (prompt) { const p = prompt; prompt = null; p.prompt(); const r = await p.userChoice.catch(() => null); if (!r || r.outcome !== "accepted") hide(7); else box.classList.remove("show"); return; }
    if (inApp) help(`<b>Abra no navegador</b>Toque nos ${B("três pontinhos")} e escolha ${B(ios ? "Abrir no Safari" : "Abrir no Chrome")}. Lá dá pra instalar.`);
    else if (ios) help(`<b>Como instalar no iPhone</b>No Safari, toque em ${B("Compartilhar")} (quadrado com seta ↑) e depois em ${B("Adicionar à Tela de Início")}.`);
    else if (mobile) help(`<b>Como instalar</b>Abra o menu ${B("⋮")} do navegador e toque em ${B("Instalar app")} ou ${B("Adicionar à tela inicial")}.`);
    else help(`<b>Como instalar no computador</b>Clique no ícone de ${B("instalar")} no fim da barra de endereço, ou no menu ${B("⋮")} e em ${B("Instalar Palpiteiro")}.`);
  };
  $("#inst-ok").onclick = install;
  window.palInstall = install;
  window.palCanInstall = () => canInstall;
  if (isStandalone || snoozed || !canInstall) return;
  // o convite aparece sozinho só depois que a pessoa entrou no app
  const wait = setInterval(() => { if (!locked()) { clearInterval(wait); setTimeout(function tryShow() { const f = $("#fav"); if (f && !f.hidden) return setTimeout(tryShow, 4000); reveal(); }, 2500); } }, 1000);
})();
function gateFail() {
  const g = document.getElementById("gate"); if (!g) return;
  g.hidden = false;
  g.innerHTML = `<div class="g-card"><div class="g-logo"><img src="icon-192.png?v=3" alt=""><h1>Palpi<span>teiro</span></h1></div>
    <p class="g-sub">Não deu para carregar o login. Confira a internet e tente de novo.</p>
    <button class="g-main" onclick="location.reload()">Tentar de novo</button></div>`;
}
window.gateFail = gateFail;
</script>
